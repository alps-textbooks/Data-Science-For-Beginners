# Synthesized table of contents for import into ALPS.
# The upstream repository is a notebook collection with no Jupyter Book TOC;
# this file gives it a book structure without altering any lesson content.
# Each lesson's worked solution is listed last in that lesson with
# `audience: instructor`: teachers see it, students never do, and no
# student page changes its number.
# Before them come the pages this edition adds to a lesson: where its
# assignment asks for written answers or uses a data file, a page to
# answer it in the browser (alps-assignment-NN), then the lesson's
# quiz questions (alps-quiz-NN). They follow every page the lesson
# already had, so no page is renumbered, and a student page's stored
# number is the number it is shown with.

format: jb-book
root: README
parts:
